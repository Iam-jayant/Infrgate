[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "infrgate-sdk"
version = "0.1.0"
description = "Python SDK for InfrGate — the intelligent LLM inference gateway."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "InfrGate Contributors" }]
readme = "README.md"
keywords = ["llm", "gateway", "openai", "inference", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "httpx>=0.27.0,<1.0.0",
    "pydantic>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "pytest-httpx>=0.35.0,<1.0.0",
    "respx>=0.22.0,<1.0.0",
    "ruff>=0.8.0,<1.0.0",
]

[project.urls]
Homepage = "https://github.com/Iam-jayant/Infrgate"
Documentation = "https://github.com/Iam-jayant/Infrgate/tree/main/sdk"
Repository = "https://github.com/Iam-jayant/Infrgate"

[tool.hatch.build.targets.wheel]
packages = ["src/infrgate_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]
