[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "infrgate"
version = "0.1.0"
description = "Intelligent inference control plane for routing, reliability, usage metering, and policy enforcement across multiple LLM providers."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "InfrGate Contributors" }]
readme = "README.md"

dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    "sqlalchemy[asyncio]>=2.0.0,<3.0.0",
    "asyncpg>=0.30.0,<1.0.0",
    "alembic>=1.14.0,<2.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
    "httpx>=0.28.0,<1.0.0",
    "redis[hiredis]>=5.0.0,<6.0.0",
    "structlog>=24.0.0,<26.0.0",
    "prometheus-client>=0.19.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "pytest-cov>=6.0.0,<7.0.0",
    "aiosqlite>=0.20.0,<1.0.0",
    "ruff>=0.8.0,<1.0.0",
    "locust>=2.20.0,<3.0.0",
]

[project.scripts]
infrgate = "infrgate.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/infrgate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["infrgate"]

[tool.coverage.run]
source = ["src/infrgate"]
omit = ["*/migrations/*", "*/alembic/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[dependency-groups]
dev = [
    "fakeredis (>=2.37.1,<3.0.0)"
]
